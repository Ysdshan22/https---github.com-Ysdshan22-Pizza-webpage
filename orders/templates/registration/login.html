```html
<!DOCTYPE html>
<html>
<head>
    <title>PizzaNor - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                url("https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1400&q=80");
            background-size:cover;
            background-position:center;
        }

        .login-container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            font-size:34px;
            font-weight:bold;
            color:#e8231a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:25px;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#222;
        }

        .message{
            background:#e9f8ec;
            color:#1f6b2a;
            border:1px solid #bee8c6;
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#e8231a;
            box-shadow:0 0 8px rgba(232,35,26,.3);
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:#e8231a;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#c91f16;
        }

        .links{
            text-align:center;
            margin-top:20px;
        }

        .links a{
            color:#e8231a;
            text-decoration:none;
            font-weight:bold;
        }

        .links a:hover{
            text-decoration:underline;
        }

        @media(max-width:500px){
            .login-container{
                width:90%;
                padding:25px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🍕 PizzaNor</div>

    <div class="subtitle">
        Welcome back! Login to continue your order.
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="links">
        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

        <br>

        <a href="{% url 'menu' %}">
            ← Back to Menu
        </a>
    </div>

</div>

</body>
</html>
```
