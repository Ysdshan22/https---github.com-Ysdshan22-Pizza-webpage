<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f8f8;
        }

        .login-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        .message-box {
            background: #eaf7ea;
            color: #1f6b2a;
            border: 1px solid #b7e1bd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">

        {% if messages %}
            {% for message in messages %}
                <div class="message-box">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <h2>Login</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p>
            Don’t have an account?
            <a href="/register/">Register</a>
        </p>

        <p>
            <a href="/">Back to menu</a>
        </p>
    </div>
</body>
</html>
