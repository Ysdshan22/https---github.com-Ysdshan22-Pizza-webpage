{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'orders/style.css' %}">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>
        Don’t have an account?
        <a href="/register/">Register</a>
    </p>

    <p>
        <a href="/">Back to menu</a>
    </p>
</body>
</html>
