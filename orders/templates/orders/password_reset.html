{% extends 'orders/base.html' %}
{% block title %}Reset Password | NapoliPizza{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div style="background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.12); max-width:460px; width:100%;">
        <div style="background:linear-gradient(135deg,#2c1810,#c0392b); padding:36px; text-align:center; color:#fff;">
            <div style="font-size:3rem; margin-bottom:12px;">🔑</div>
            <h2 style="font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; margin-bottom:8px;">Forgot Password?</h2>
            <p style="color:#d4b8a8; font-size:0.88rem;">No worries. Enter your email and we will send you a reset link.</p>
        </div>
        <div style="padding:36px;">
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:20px;">
                    <label style="display:block; font-size:0.82rem; font-weight:600; color:#2c1810; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px;">Email Address</label>
                    <input type="email" name="email" placeholder="you@example.no" required
                           style="width:100%; padding:12px 16px; border:2px solid #e8d5b7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:0.9rem; color:#2c1810; background:#fdf6ec; outline:none;">
                </div>
                <button type="submit"
                        style="width:100%; padding:13px; background:#c0392b; color:white; border:none; border-radius:10px; font-family:'Poppins',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer;">
                    Send Reset Link →
                </button>
            </form>
            <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:#8b6f5e;">
                Remember your password?
                <a href="{% url 'login' %}" style="color:#c0392b; font-weight:600; text-decoration:none;">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
