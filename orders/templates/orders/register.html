```html
<!DOCTYPE html>
<html>
<head>
    <title>PizzaNor - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                url("https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1400&q=80");
            background-size:cover;
            background-position:center;
        }

        .register-container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            font-size:34px;
            font-weight:bold;
            color:#e8231a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:25px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#222;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#e8231a;
            box-shadow:0 0 8px rgba(232,35,26,.3);
        }

        .register-btn{
            width:100%;
            padding:14px;
            background:#e8231a;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .register-btn:hover{
            background:#c91f16;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#555;
            font-weight:bold;
        }

        .back-btn:hover{
            color:#e8231a;
        }

        @media(max-width:500px){
            .register-container{
                width:90%;
                padding:25px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">🍕 PizzaNor</div>

    <div class="subtitle">
        Create your account and start ordering delicious pizza
    </div>

    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <input type="text"
               name="first_name"
               placeholder="First Name"
               required>

        <input type="text"
               name="last_name"
               placeholder="Last Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <button type="submit" class="register-btn">
            Create Account
        </button>
    </form>

    <a href="{% url 'menu' %}" class="back-btn">
        ← Back to Menu
    </a>

</div>

</body>
</html>
```
