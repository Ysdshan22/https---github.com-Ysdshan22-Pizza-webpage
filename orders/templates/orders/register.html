<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background-color: #f8f8f8;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 8px 14px;
            border-radius: 6px;
        }

        a:hover {
            background-color: #0056b3;
        }

        .message-box {
            background: #eaf7ea;
            color: #1f6b2a;
            border: 1px solid #b7e1bd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="form-box">

    {% if messages %}
        {% for message in messages %}
            <div class="message-box">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <input type="text" name="first_name" placeholder="First Name">
        <input type="text" name="last_name" placeholder="Last Name">
        <input type="email" name="email" placeholder="Email">

        <button type="submit">Register</button>
    </form>

    <a href="{% url 'menu' %}">Back to Menu</a>

</div>

</body>
</html>
