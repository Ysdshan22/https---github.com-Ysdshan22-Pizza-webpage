{% extends 'orders/base.html' %}
{% block title %}Password Reset Complete | NapoliPizza{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div style="background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.12); max-width:460px; width:100%; text-align:center;">
        <div style="background:linear-gradient(135deg,#1a7a40,#2ecc71); padding:36px; color:#fff;">
            <div style="font-size:3rem; margin-bottom:12px;">🎉</div>
            <h2 style="font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; margin-bottom:8px;">Password Reset!</h2>
            <p style="color:#d4f0e0; font-size:0.88rem;">Your password has been set successfully.</p>
        </div>
        <div style="padding:36px;">
            <p style="color:#5a3e35; font-size:0.9rem; line-height:1.7; margin-bottom:24px;">
                You can now sign in with your new password and order some delicious pizza!
            </p>
            <a href="{% url 'login' %}"
               style="display:block; padding:13px; background:#c0392b; color:white; border-radius:10px; font-family:'Poppins',sans-serif; font-size:0.95rem; font-weight:700; text-decoration:none;">
                Sign In Now →
            </a>
        </div>
    </div>
</div>
{% endblock %}
